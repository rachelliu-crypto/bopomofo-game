<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ㄅㄆㄇ 魔法遊樂園 - Duolingo 拼音大挑戰</title>
    <!-- 引入與策展頁相同的 Tailwind CSS 與 FontAwesome 圖標 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts 統一字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', 'Zen Maru Gothic', sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-user-select: none;
            user-select: none;
        }

        /* 繼承策展頁暖黃色漸層設計 */
        .course-gradient-game {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            border-radius: 2.5rem;
            border: 4px solid white;
            box-shadow: 0 15px 35px -10px rgba(245, 158, 11, 0.35);
            position: relative;
            overflow: hidden;
        }

        /* 按鈕 - 高質感紫色漸層產生高對比與一致視覺 */
        .btn-action-game {
            background: linear-gradient(145deg, #5b4a9a 0%, #3a2e66 100%);
            color: #ffffff;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 0px #2a1f50;
        }

        .btn-action-game:hover {
            background: linear-gradient(145deg, #705cb5 0%, #4c3d80 100%);
            transform: scale(1.03);
            box-shadow: 0 10px 0px #2a1f50;
        }

        .btn-action-game:active {
            transform: scale(0.98);
            box-shadow: 0 2px 0px #2a1f50;
        }

        /* 生字簿田字格 */
        .char-grid-box {
            background-color: #faf5ff; /* 淺紫底色 */
            border: 3px solid #d8b4fe; /* 紫色邊框 */
            box-shadow: 0 4px 0 #c084fc;
            position: relative;
        }

        /* 繪製米字格虛線襯底 */
        .char-grid-box::before, .char-grid-box::after {
            content: '';
            position: absolute;
            border: 1px dashed rgba(192, 132, 252, 0.35);
            pointer-events: none;
        }
        .char-grid-box::before { top: 0; bottom: 0; left: 50%; width: 0; }
        .char-grid-box::after { left: 0; right: 0; top: 50%; height: 0; }

        /* 單個注音符號空格 */
        .bopo-slot {
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 當前等待點擊的高亮空格（亮黃色標記） */
        .bopo-slot.active-slot {
            border-color: #a855f7;
            background-color: #f3e8ff;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.4);
            animation: slot-pulse 1s infinite alternate;
        }

        @keyframes slot-pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        /* 已答對填入的格子 */
        .bopo-slot.filled-slot {
            border-color: #c084fc;
            background-color: #ffffff;
            box-shadow: 0 2px 0 rgba(0,0,0,0.05);
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 注音氣泡按鈕 */
        .bopo-bubble {
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.15);
            box-shadow: 0 4px 0 rgba(0,0,0,0.08);
        }

        .bopo-bubble:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.08);
        }

        /* 答錯晃動 */
        .shake-anim {
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        /* 慶祝彩色屑屑 */
        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 50;
            animation: explode-confetti 0.8s ease-out forwards;
        }

        @keyframes explode-confetti {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
        }

        /* 複製成功提示 (Toast) */
        #gameToast {
            visibility: hidden;
            opacity: 0;
            transform: translate(-50%, -40%) scale(0.9);
            transition: opacity 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.15), 
                        transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        visibility 0.25s;
        }

        #gameToast.show {
            visibility: visible;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* 為了完美支援手機不換行且能滑動 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<script>

    const allQuestions = [

    // 台灣標準注音聲調表
    const toneSymbols = ['ˊ', 'ˇ', 'ˋ', '˙'];

    // 干擾字符池
    const distractorBopo = ['ㄅ', 'ㄆ', 'ㄇ', 'ㄈ', 'ㄉ', 'ㄊ', 'ㄋ', 'ㄌ', 'ㄍ', 'ㄎ', 'ㄏ', 'ㄐ', 'ㄑ', 'ㄒ', 'ㄓ', 'ㄔ', 'ㄕ', 'ㄖ', 'ㄗ', 'ㄘ', 'ㄙ', 'ㄚ', 'ㄛ', 'ㄜ', 'ㄝ', 'ㄞ', 'ㄟ', 'ㄠ', 'ㄡ', 'ㄢ', 'ㄣ', 'ㄤ', 'ㄥ', 'ㄦ', 'ㄧ', 'ㄨ', 'ㄩ', 'ˊ', 'ˇ', 'ˋ', '˙'];

    // 2. 遊戲變數
    let selectedQuestions = [];

    let voiceEnabled = true;

    // Web Audio API 音效生成
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(type) {
        if (!voiceEnabled) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'pop') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(380, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(750, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        } else if (type === 'success') {
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); // E5
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.16); // G5
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(170, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }
    }

    // 朗讀字詞 (修復電腦版 TTS 沒聲音、發音佇列卡死問題)
    function speak(text) {
        if (!voiceEnabled) return;
        const synth = window.speechSynthesis;
        if (!synth) return;
        
        // 先強制中斷可能卡死在前一個狀態的語音佇列
        synth.cancel();
        
        // 延遲 50ms 確保系統完全釋放之前的發音線程再播放，這能大幅解決電腦版無聲的問題
        setTimeout(() => {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW';
            utterance.rate = 0.85; // 小朋友友善語速
            
            // 尋找台灣在地的中文女聲（如果有的話，讓發音更甜美）
            const voices = synth.getVoices();
            const localVoice = voices.find(v => v.lang.includes('ZH-TW') || v.lang.includes('zh-TW') || v.lang.includes('zh_TW'));
            if (localVoice) {
                utterance.voice = localVoice;
            }

            // 錯誤處理與重啟機制
            utterance.onerror = (event) => {
                console.error("語音播放錯誤：", event.error);
                if (event.error === 'interrupted') return;
                // 如果被瀏覽器暫停了，嘗試強制喚醒
                synth.resume();
            };

            try {
                synth.speak(utterance);
            } catch (e) {
                console.error("TTS 發音失敗:", e);
            }
        }, 50);
    }

    // 💡 第一次點擊網頁任何地方時，初始化並解鎖語音引擎（針對電腦版瀏覽器的安全阻擋）
    window.addEventListener('click', () => {
        const synth = window.speechSynthesis;
        if (synth && synth.speaking === false) {
            // 播放一個極短的空白發音來解鎖音訊通道
            const u = new SpeechSynthesisUtterance('');
            u.volume = 0;
            synth.speak(u);
        }
    }, { once: true });

    // 3. 啟動遊戲
    function startNewGame() {
        const shuffled = [...allQuestions].sort(() => 0.5 - Math.random());

    // 4. 載入題目
    function loadQuestion() {
        const q = selectedQuestions[currentQuestionIndex];

        document.getElementById('targetEmoji').innerText = q.emoji;

        // 修改後的動態提示語：[單字]要怎麼拼呢？
        document.getElementById('speechBubble').innerText = `「${q.word}」要怎麼拼呢？`;
        
        // 💡 修正電腦版沒聲音：將此處的自動引導 speak 移除 (autoplay政策會封鎖它進而導致後續全部沒聲音)
        // speak(q.word); 

        spellingSequence = [];
        let absoluteSlotId = 0;

        const slotsContainer = document.getElementById('spellingSlotsContainer');
        slotsContainer.innerHTML = '';

        q.parts.forEach((part, charIndex) => {
            // 建立生字格大外框 (改為 justify-center 讓拔除國字後的注音格能完全垂直置中)

            // 分離「主拼音字母」與「聲調符號」
            const spellCopy = [...part.spell];
            let toneSymbol = null;
            if (spellCopy.length > 0 && toneSymbols.includes(spellCopy[spellCopy.length - 1])) {
                toneSymbol = spellCopy.pop(); // 把聲調抽出來
            }

            // 建立注音符號直排的容器 (垂直間隔拉大為 gap-4，留出優雅舒適的空白)
            const pronunciationWrapper = document.createElement('div');
            pronunciationWrapper.className = 'flex flex-col gap-4 items-center justify-center';

            // 1. 產生主注音符號空格 (改為純白色 bg-white 不透明底色，改為 rounded-2xl 設計圓角)
            spellCopy.forEach((symbol) => {

                slot.id = `slot-${absoluteSlotId}`;
                slot.innerText = '';
                
                pronunciationWrapper.appendChild(slot);

                spellingSequence.push({
                    symbol: symbol,
                    solved: false,
                    charIndex: charIndex,
                    slotId: absoluteSlotId
                });

                absoluteSlotId++;
            });

            // 2. 建立定位聲調與拼音格的中央相對定位容器
            const zhuyinContainer = document.createElement('div');
            zhuyinContainer.className = 'relative flex items-center justify-center';
            zhuyinContainer.appendChild(pronunciationWrapper); // 拼音直排永遠為寬度基準，端正居中

            // 3. 如果有聲調，使用絕對定位（Absolute Positioning）附屬定位
            if (toneSymbol) {
                const slot = document.createElement('div');
                slot.id = `slot-${absoluteSlotId}`;
                slot.innerText = '';

                // 標準台灣排版規則定位 (改為 rounded-2xl 設計圓角)：
                if (toneSymbol === '˙') {
                    // 輕聲 (˙)：置於注音符號直列的「正上方」，不影響左右居中，底色改為純白不透明
                    slot.className = 'bopo-slot w-8 h-8 border-2 border-dashed border-purple-300 rounded-2xl bg-white flex items-center justify-center font-black text-lg text-purple-950 absolute bottom-[calc(100%+8px)] left-1/2 -translate-x-1/2 shadow-sm';
                } else {
                    // 二、三、四聲：置於注音符號直列的「右側」，不影響左右居中，底色改為純白不透明
                    slot.className = 'bopo-slot w-8 h-8 border-2 border-dashed border-purple-300 rounded-2xl bg-white flex items-center justify-center font-black text-lg text-purple-950 absolute left-[calc(100%+10px)] top-1/2 -translate-y-1/2 shadow-sm';
                }

                zhuyinContainer.appendChild(slot);

                spellingSequence.push({
                    symbol: toneSymbol,
                    solved: false,
                    charIndex: charIndex,
                    slotId: absoluteSlotId
                });

                absoluteSlotId++;
            }

            // 將注音區置中排版放入生字格中
            const zhuyinOuter = document.createElement('div');
            zhuyinOuter.className = 'flex items-center justify-center w-full';
            zhuyinOuter.appendChild(zhuyinContainer);

            charBox.appendChild(zhuyinOuter);
            slotsContainer.appendChild(charBox);
        });

        currentSequenceIndex = 0;
        markActiveSlot();
        buildBubblePool(q);
    }

    // 建立選項氣泡池
    function buildBubblePool(q) {
        let correctSymbols = [];
        q.parts.forEach(p => {
            correctSymbols = correctSymbols.concat(p.spell);
        });

        // 💡 優化：動態限制干擾字數量，使選項更充實 (總數設定為 8 個，寬版與滑動並存防換行)
        let maxTotalBubbles = 8; 
        let distractorCount = Math.max(1, maxTotalBubbles - correctSymbols.length);

        let distractors = [];
        while (distractors.length < distractorCount) {
            let rand = distractorBopo[Math.floor(Math.random() * distractorBopo.length)];
            if (!correctSymbols.includes(rand) && !distractors.includes(rand)) {
                distractors.push(rand);
            }
        }

        // 打亂順序
        let pool = [...correctSymbols, ...distractors].sort(() => 0.5 - Math.random());

        const poolContainer = document.getElementById('bubblePool');
        poolContainer.innerHTML = '';

        // 氣泡配色 - 底色全部改為不透明純白「bg-white」，僅邊框和文字保有高對比配色 (圓角皆為 rounded-full 圓形)
        const bubbleTailwindColors = [
            'bg-white border-purple-300 text-purple-700 hover:bg-purple-50',
            'bg-white border-rose-300 text-rose-600 hover:bg-rose-50',
            'bg-white border-sky-300 text-sky-600 hover:bg-sky-50',
            'bg-white border-amber-300 text-amber-700 hover:bg-amber-50',
            'bg-white border-emerald-300 text-emerald-700 hover:bg-emerald-50'
        ];

        pool.forEach((symbol) => {
            const btn = document.createElement('button');
            const randColor = bubbleTailwindColors[Math.floor(Math.random() * bubbleTailwindColors.length)];
            btn.className = `bopo-bubble w-12 h-12 rounded-full border-2 font-black text-xl flex items-center justify-center transition-all shrink-0 ${randColor}`;
            btn.innerText = symbol;
            
            btn.addEventListener('click', () => {
                handleBubbleTap(symbol, btn);
            });

            poolContainer.appendChild(btn);
        });
    }

    function markActiveSlot() {
        document.querySelectorAll('.bopo-slot').forEach(slot => {
            slot.classList.remove('active-slot');
        });

        if (currentSequenceIndex < spellingSequence.length) {
            const target = spellingSequence[currentSequenceIndex];
            const activeSlot = document.getElementById(`slot-${target.slotId}`);
            if (activeSlot) {
                activeSlot.classList.add('active-slot');
            }
        }
    }

    // 處理點選判定
    function handleBubbleTap(symbol, btnElement) {
        if (currentSequenceIndex >= spellingSequence.length) return;

        const target = spellingSequence[currentSequenceIndex];

        if (symbol === target.symbol) {
            // 答對
            playBeep('pop');
            createConfetti(btnElement);

            const activeSlot = document.getElementById(`slot-${target.slotId}`);
            if (activeSlot) {
                activeSlot.innerText = symbol;
                activeSlot.classList.remove('active-slot');
                activeSlot.classList.add('filled-slot');
            }

            // 置灰已使用的按鈕
            btnElement.classList.add('opacity-30', 'pointer-events-none');
            btnElement.style.boxShadow = 'none';
            btnElement.style.transform = 'translateY(3px)';

            currentSequenceIndex++;
            target.solved = true;

            if (currentSequenceIndex >= spellingSequence.length) {
                handleQuestionComplete();
            } else {
                markActiveSlot();
            }
        } else {
            // 答錯
            playBeep('wrong');
            btnElement.classList.add('shake-anim');
            setTimeout(() => btnElement.classList.remove('shake-anim'), 400);

            const activeSlot = document.getElementById(`slot-${target.slotId}`);
            if (activeSlot) {
                activeSlot.classList.add('shake-anim');
                setTimeout(() => activeSlot.classList.remove('shake-anim'), 400);
            }
        }
    }

    // 特效碎花
    function createConfetti(btn) {
        const screen = document.getElementById('gameScreen');
        const colors = ['#f43f5e', '#fbbf24', '#10b981', '#0ea5e9', '#a855f7'];
        const rect = btn.getBoundingClientRect();
        const screenRect = screen.getBoundingClientRect();

        const xOffset = rect.left - screenRect.left + (rect.width / 2);
        const yOffset = rect.top - screenRect.top + (rect.height / 2);

        for (let i = 0; i < 15; i++) {
            const p = document.createElement('div');
            p.className = 'confetti';
            p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            p.style.left = `${xOffset}px`;
            p.style.top = `${yOffset}px`;

            const angle = Math.random() * Math.PI * 2;
            const velocity = 35 + Math.random() * 70;
            const x = Math.cos(angle) * velocity;
            const y = Math.sin(angle) * velocity;

            p.style.setProperty('--x', `${x}px`);
            p.style.setProperty('--y', `${y}px`);

            screen.appendChild(p);
            setTimeout(() => p.remove(), 800);
        }
    }

    // 載入遊戲
    window.onload = function() {
        startNewGame();
    };
</script>
